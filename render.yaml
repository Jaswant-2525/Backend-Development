services:
  # --- Backend Service (Already Exists) ---
  - type: web
    name: fsd-35-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  # --- Frontend Service (ADD THIS PART) ---
  - type: static
    name: fsd-35-frontend
    env: static
    plan: free
    # No build command needed for plain HTML/CSS/JS
    buildCommand: ""
    # This tells Render your files are in the 'frontend' folder
    staticPublishPath: ./frontend
