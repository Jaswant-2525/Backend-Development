<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Evaluation System</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-container">
        <h2>Internal Evaluation System</h2>
        
        <div id="login-section">
            <h3>Login</h3>
            <input type="text" id="login-username" placeholder="Username">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="login()">Login</button>
            <p>New here? <a href="#" onclick="toggleAuth()">Register</a></p>
        </div>

        <div id="register-section" class="hidden">
            <h3>Register</h3>
            <input type="text" id="reg-username" placeholder="Username">
            <input type="password" id="reg-password" placeholder="Password">
            <select id="reg-role">
                <option value="EVALUATOR">Evaluator</option>
                <option value="ADMIN">Admin</option>
                <option value="STUDENT">Student</option>
            </select>
            <button onclick="register()">Register</button>
            <p>Already have an account? <a href="#" onclick="toggleAuth()">Login</a></p>
        </div>
        <p id="auth-error" class="error-msg"></p>
    </div>
    <script src="app.js"></script>
</body>
</html>
